<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education.AI — facilit.AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="educacao.css" />
  </head>
  <body>
    <div class="top-bar">
      <div class="brand">
        <div class="icon-badge"></div>
        <span class="title">Education.AI</span>
      </div>
      <div class="right">
        <a href="index.html" class="back-link">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5" />
            <path d="M12 19l-7-7 7-7" />
          </svg>
          <span>Voltar</span>
        </a>
      </div>
    </div>

    <div class="main">
      <div class="chat-area" id="chatArea">
        <div class="chat-inner" id="chatInner">
          <div class="welcome" id="welcomeBlock">
            <div class="mark"></div>
            <h1>O que você quer aprender hoje?</h1>
            <p>
              Sou a Education.AI. Explico qualquer assunto do seu jeito, monto
              cronogramas de estudo e te ajudo a se preparar para provas e
              concursos.
            </p>
          </div>

          <div class="suggestions" id="chatSuggestions">
            <button class="suggestion-chip" type="button">
              Me explique um assunto difícil
            </button>
            <button class="suggestion-chip" type="button">
              Montar um cronograma de estudos
            </button>
            <button class="suggestion-chip" type="button">
              Dicas para me preparar para uma prova
            </button>
          </div>
        </div>
      </div>

      <div class="input-zone">
        <form class="input-bar" id="chatForm">
          <input
            type="text"
            id="chatInput"
            placeholder="Escreva sua mensagem..."
            autocomplete="off"
          />
          <button
            type="submit"
            class="send-btn"
            id="chatSend"
            aria-label="Enviar mensagem"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 2L11 13" />
              <path d="M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </form>
      </div>
      <p class="input-hint">
        A Education.AI pode cometer erros. Confira informações importantes antes
        de usar.
      </p>
    </div>

    <script>
  const chatInner = document.getElementById("chatInner");
  const chatArea = document.getElementById("chatArea");
  const chatForm = document.getElementById("chatForm");
  const chatInput = document.getElementById("chatInput");
  const chatSend = document.getElementById("chatSend");
  const welcomeBlock = document.getElementById("welcomeBlock");
  const chatSuggestions = document.getElementById("chatSuggestions");

  const history = [];

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = "msg-row " + (role === "user" ? "user" : "bot");

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (role === "user" ? "user" : "bot");
    avatar.textContent = role === "user" ? "Você" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    
    // Substitui quebras de linha da IA por <br> para renderizar o texto bonito na tela
    bubble.innerHTML = text.replace(/\n/g, '<br>');

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatInner.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg-row bot";

    const avatar = document.createElement("div");
    avatar.className = "avatar bot";
    avatar.textContent = "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble typing-bubble";
    bubble.innerHTML = "<span>.</span><span>.</span><span>.</span>";

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatInner.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return row;
  }

  async function sendMessage(text) {
    if (!text || !text.trim()) return;

    if (welcomeBlock) welcomeBlock.remove();
    if (chatSuggestions) chatSuggestions.remove();

    addMessage("user", text);
    chatInput.value = "";
    chatSend.disabled = true;

    const typingRow = addTyping();

    try {
      // Faz a requisição para a rota correta do seu backend local
      const response = await fetch("http://localhost:5500/api/ia/educacao", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json" 
        },
        body: JSON.stringify({ mensagem: text }) // Envia como 'mensagem' igual ao seu backend
      });

      if (!response.ok) {
        throw new Error(`Erro na requisição: Status ${response.status}`);
      }

      const data = await response.json();
      typingRow.remove();

      let reply = "Pronta pra te ajudar a aprender!";
      if (data && data.resposta) {
        reply = data.resposta;
      } else if (data && data.error) {
        reply = `Erro no servidor: ${data.error}`;
      }

      addMessage("bot", reply);
    } catch (err) {
      if (typingRow) typingRow.remove();
      addMessage(
        "bot",
        "Desculpa, tive um problema para responder agora. Pode tentar de novo?",
      );
      console.error("Education.AI chat error:", err);
    } finally {
      chatSend.disabled = false;
      chatInput.focus();
    }
  }

  chatForm.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage(chatInput.value);
  });

  document.querySelectorAll(".suggestion-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      sendMessage(chip.textContent.trim());
    });
  });
</script>
  </body>
</html>
